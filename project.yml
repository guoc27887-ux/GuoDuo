name: HongGuo
options:
  bundleIdPrefix: me.rrmm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: "32"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  HongGuo:
    type: application
    platform: iOS
    sources:
      - path: HongGuo
    preBuildScripts:
      - name: 打包 JS 核心
        script: |
          cd "$SRCROOT/core"
          if [ -d node_modules ]; then PATH="$PATH:/opt/homebrew/bin:$HOME/.local/bin" node build.cjs; fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.hongguo
        PRODUCT_NAME: HongGuo
        INFOPLIST_KEY_CFBundleDisplayName: GuoDuo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: GuoDuo 需要访问本地网络，才能找到你家里的电视、安装 GuoDuo TV 和用手机遥控。
        INFOPLIST_KEY_NSCameraUsageDescription: 扫电视上的二维码，连接 GuoDuo TV 遥控。
    info:
      path: HongGuo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
        NSBonjourServices: ["_adb._tcp", "_guoduo._tcp"]
        # 长按 App 图标的菜单
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: me.rrmm.hongguo.scan
            UIApplicationShortcutItemTitle: 扫一扫
            UIApplicationShortcutItemIconSymbolName: qrcode.viewfinder
          - UIApplicationShortcutItemType: me.rrmm.hongguo.remote
            UIApplicationShortcutItemTitle: 连接遥控器
            UIApplicationShortcutItemIconSymbolName: appletvremote.gen4
        # GuoDuo TV 遥控接口是局域网 http（电视上跑的小服务），只放开本地网络，公网仍强制 https
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HongGuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HongGuoUITests
    dependencies:
      - target: HongGuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.hongguo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HongGuo
schemes:
  HongGuo:
    build:
      targets:
        HongGuo: all
        HongGuoUITests: [test]
    test:
      targets: [HongGuoUITests]
