name: HongGuo
options:
  bundleIdPrefix: me.rrmm
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.6.8
    CURRENT_PROJECT_VERSION: "28"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  HongGuo:
    type: application
    platform: iOS
    sources:
      - path: HongGuo
    preBuildScripts:
      - name: 打包 JS 核心
        script: |
          cd "$SRCROOT/core"
          if [ -d node_modules ]; then PATH="$PATH:/opt/homebrew/bin:$HOME/.local/bin" node build.cjs; fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.hongguo
        PRODUCT_NAME: HongGuo
        INFOPLIST_KEY_CFBundleDisplayName: GuoDuo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: HongGuo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true
  HongGuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HongGuoUITests
    dependencies:
      - target: HongGuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.hongguo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HongGuo
schemes:
  HongGuo:
    build:
      targets:
        HongGuo: all
        HongGuoUITests: [test]
    test:
      targets: [HongGuoUITests]
